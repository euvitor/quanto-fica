name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Job 1: Testes e Validação do Backend (Java 21)
  # ==========================================
  backend-ci:
    name: Backend CI (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar Permissão de Execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar Testes Automatizados (23 testes)
        run: ./mvnw clean test

  # ==========================================
  # Job 2: Build e Validação do Frontend (Angular Zoneless)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Node 22 + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências (Clean Install)
        run: npm ci

      - name: Compilar Frontend para Produção
        run: npm run build