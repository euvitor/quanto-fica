spring.application.name=backend-test

# Banco de dados H2 em memória simulando a sintaxe do PostgreSQL
spring.datasource.url=jdbc:h2:mem:quantofica_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Validação do Schema com o Flyway no H2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true