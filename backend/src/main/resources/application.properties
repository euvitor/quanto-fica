spring.application.name=backend

# Conexão com o PostgreSQL (com fallback para variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantofica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
# 'validate' instrui o Hibernate a apenas validar se as entidades batem com o Flyway, sem alterar o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway ativo
spring.flyway.enabled=true