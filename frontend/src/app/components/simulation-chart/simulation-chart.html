@if (simulation(); as sim) {
  <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-5">

    <!-- Cabeçalho do Gráfico -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-100 pb-4">
      <div>
        <h3 class="text-base font-bold text-slate-900 tracking-tight">Curva de Amortização vs Juros (SAC)</h3>
        <p class="text-xs text-slate-500 mt-0.5">
          Evolução temporal das parcelas ao longo dos {{ sim.termMonths }} meses ({{ sim.termMonths / 12 }} anos).
        </p>
      </div>

      <div class="flex items-center gap-3 text-xs text-slate-600 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 self-start sm:self-auto font-medium">
        <span class="inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span> Parcela Total
        </span>
        <span class="text-slate-300">|</span>
        <span class="inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> Juros
        </span>
        <span class="text-slate-300">|</span>
        <span class="inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span> Amortização Fixa
        </span>
      </div>
    </div>

    <!-- Container do Canvas com amplitude -->
    <div class="relative w-full h-80 sm:h-96">
      <canvas #chartCanvas></canvas>
    </div>

  </div>
}
